# The kind cluster for the CNTi essential-tests job: a control plane and three
# workers. Every node mounts the same runner directory where kind's storage
# provisioner keeps its volumes, so with the provisioner in shared mode (see
# the workflow) a volume is reachable from every node and follows its pod, as
# on a cluster with network storage: MongoDB's members move on a node drain.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts: &shared-storage
      - hostPath: /tmp/kind-shared-storage
        containerPath: /var/local-path-provisioner
  - role: worker
    extraMounts: *shared-storage
  - role: worker
    extraMounts: *shared-storage
  - role: worker
    extraMounts: *shared-storage
