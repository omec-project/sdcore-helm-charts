on:
  schedule:
    - cron: "0 0 * * 1,4"  # Mondays and Thursdays

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  stale:
    permissions:
      issues: write
      pull-requests: write
      contents: read
      actions: read
    uses: omec-project/.github/.github/workflows/stale-issue.yml@c6f69e74f8ee9034dcc237ccbd719de59526aee5 # v0.0.30
    with:
      days_before_stale: 120
      days_before_close: 15
    secrets: inherit
