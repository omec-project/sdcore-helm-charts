on:
  schedule:
    - cron: "0 0 * * 1,4"  # Mondays and Thursdays

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  stale:
    permissions:
      issues: write
      pull-requests: write
      contents: read
      actions: read
    uses: omec-project/.github/.github/workflows/stale-issue.yml@31eaa229af3f5e73c45cc7f165f614716f6b96f6 # v0.1.2
    with:
      days_before_stale: 120
      days_before_close: 15
    secrets: inherit
