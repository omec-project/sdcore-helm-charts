on:
  schedule:
    - cron: "0 0 * * 1,4"  # Mondays and Thursdays

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  stale:
    permissions:
      issues: write
      pull-requests: write
      contents: read
      actions: read
    uses: omec-project/.github/.github/workflows/stale-issue.yml@f920a09dd4b3fca4d6a40f36bb75f3cd2217bd59 # v0.0.34
    with:
      days_before_stale: 120
      days_before_close: 15
    secrets: inherit
