{{- if .Values.config.upfadapter.deploy }}
---
apiVersion: v1
kind: Service
metadata:
  name: upf-adapter
  labels:
{{ tuple "upfadapter" . | include "5g-control-plane.metadata_labels" | indent 4 }}
spec:
  type: {{ .Values.config.upfadapter.serviceType }}
  selector:
{{ tuple "upfadapter" . | include "5g-control-plane.metadata_labels" | indent 4 }}
  ports:
{{- tuple "pfcp" .Values.config.upfadapter.n4 "UDP" .Values.config.upfadapter.serviceType | include "5g-control-plane.service_port" | nindent 2 }}
  - name: upfadapter-rest
    port: {{ .Values.config.upfadapter.rest.port }}
    protocol: TCP
{{- end }}
