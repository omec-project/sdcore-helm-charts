{{- if .Values.config.smf.deploy }}
{{ tuple "smf" . | include "5g-control-plane.service_account" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smf
  labels:
{{ tuple "smf" . | include "5g-control-plane.metadata_labels" | indent 4 }}
spec:
  replicas: 1
  #serviceName: smf-headless
  selector:
    matchLabels:
{{ tuple "smf" . | include "5g-control-plane.metadata_labels" | indent 6 }}
  template:
    metadata:
      labels:
{{ tuple "smf" . | include "5g-control-plane.metadata_labels" | indent 8 }}
      annotations:
    {{- tuple "smf" . | include "5g-control-plane.certs_pod_annotations" | nindent 8 }}
    {{- if .Values.mongodb.enabled }}
        checksum/mongodb-credentials: {{ include "5g-control-plane.mongodbCredentialsChecksum" . | quote }}
    {{- end }}
    {{- with .Values.config.smf.podAnnotations }}
    {{- toYaml . | nindent 8 }}
    {{- end }}
    spec:
    {{- tuple "smf" . | include "5g-control-plane.pod_common" | trim | nindent 6 }}
      initContainers:
      {{- if .Values.config.webui.deploy }}
      {{- tuple . | include "5g-control-plane.wait_webui" | nindent 6 }}
      {{- end }}
      {{- if .Values.kafka.enabled }}
      - name: wait-kafka-module
        image: {{ .Values.images.repository }}{{ .Values.images.tags.init }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        command: ['sh', '-c', 'until nslookup kafka && nc -z -w 2 kafka 9092; do echo waiting for kafka listener; sleep 4; done;']
      {{- end }}
    {{ tuple "smf" . | include "5g-control-plane.certs_init" | nindent 6 }}
      {{ if .Values.config.coreDump.enabled }}
{{ tuple "smf" . | include "5g-control-plane.coredump_init" | nindent 6 }}
      {{ end }}
      containers:
      - name: smf
        image: {{ .Values.images.repository }}{{ .Values.images.tags.smf }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
      {{ if .Values.config.coreDump.enabled }}
        securityContext:
          runAsUser: 0
      {{ end }}
        stdin: true
        tty: true
        command: [ /opt/smf-run.sh ]
        env:
      {{- if eq .Values.config.GIN.mode "release" }}
        - name: GIN_MODE
          value: release
      {{- end }}
{{ tuple "smf" . | include "5g-control-plane.certs_env" | indent 8 }}
        - name: PFCP_PORT_UPF
          value: {{ .Values.config.smf.upfPort | quote }}
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        {{- tuple .Values.config.smf.sbi.port . | include "5g-control-plane.probes" | nindent 8 }}
      {{- if .Values.resources.enabled }}
        resources:
{{ toYaml .Values.resources.smf | indent 10 }}
      {{- end }}
        volumeMounts:
        - name: nf-config
          mountPath: /opt
{{ tuple "smf" . | include "5g-control-plane.certs_volume_mounts" | indent 8 }}
      {{- if .Values.config.coreDump.enabled }}
        - name: coredump
          mountPath: /tmp/coredump
      {{- end }}
      volumes:
      - name: nf-config
        {{- if .Values.mongodb.enabled }}
        secret:
          secretName: smf
        {{- else }}
        configMap:
          name: smf
        {{- end }}
          defaultMode: 493
      {{- tuple "smf" . | include "5g-control-plane.certs_volumes" | nindent 6 }}
{{- end }}
