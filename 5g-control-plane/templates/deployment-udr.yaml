{{- if .Values.config.udr.deploy }}
{{ tuple "udr" . | include "5g-control-plane.service_account" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udr
  labels:
{{ tuple "udr" . | include "5g-control-plane.metadata_labels" | indent 4 }}
spec:
  replicas: 1
  #serviceName: udr-headless
  selector:
    matchLabels:
{{ tuple "udr" . | include "5g-control-plane.metadata_labels" | indent 6 }}
  template:
    metadata:
      labels:
{{ tuple "udr" . | include "5g-control-plane.metadata_labels" | indent 8 }}
      annotations:
    {{- tuple "udr" . | include "5g-control-plane.certs_pod_annotations" | nindent 8 }}
    {{- if .Values.mongodb.enabled }}
        checksum/mongodb-credentials: {{ include "5g-control-plane.mongodbCredentialsChecksum" . | quote }}
    {{- end }}
    {{- with .Values.config.udr.podAnnotations }}
    {{- toYaml . | nindent 8 }}
    {{- end }}
    spec:
    {{- tuple "udr" . | include "5g-control-plane.pod_common" | trim | nindent 6 }}
      initContainers:
      {{- if .Values.config.webui.deploy }}
      {{- tuple . | include "5g-control-plane.wait_webui" | nindent 6 }}
      {{- end }}
      {{- tuple "wait-udr-module" "udr" . | include "5g-control-plane.wait_dns" | nindent 6 }}
    {{ tuple "udr" . | include "5g-control-plane.certs_init" | nindent 6 }}
      {{ if .Values.config.coreDump.enabled }}
{{ tuple "udr" . | include "5g-control-plane.coredump_init" | nindent 6 }}
      {{ end }}
      containers:
      - name: udr
        image: {{ .Values.images.repository }}{{ .Values.images.tags.udr }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
      {{ if .Values.config.coreDump.enabled }}
        securityContext:
          runAsUser: 0
      {{ end }}
        stdin: true
        tty: true
        command: ["/opt/udr-run.sh"]
        env:
      {{- if eq .Values.config.GIN.mode "release" }}
        - name: GIN_MODE
          value: release
      {{- end }}
{{ tuple "udr" . | include "5g-control-plane.certs_env" | indent 8 }}
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        {{- tuple .Values.config.udr.sbi.port . | include "5g-control-plane.probes" | nindent 8 }}
      {{- if .Values.resources.enabled }}
        resources:
{{ toYaml .Values.resources.udr | indent 10 }}
      {{- end }}
        volumeMounts:
        - name: nf-config
          mountPath: /opt
{{ tuple "udr" . | include "5g-control-plane.certs_volume_mounts" | indent 8 }}
      {{- if .Values.config.coreDump.enabled }}
        - name: coredump
          mountPath: /tmp/coredump
      {{- end }}
      volumes:
      - name: nf-config
        {{- if .Values.mongodb.enabled }}
        secret:
          secretName: udr
        {{- else }}
        configMap:
          name: udr
        {{- end }}
          defaultMode: 493
      {{- tuple "udr" . | include "5g-control-plane.certs_volumes" | nindent 6 }}
{{- end }}
