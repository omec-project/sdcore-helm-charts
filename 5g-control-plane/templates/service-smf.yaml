{{- if .Values.config.smf.deploy }}
---
apiVersion: v1
kind: Service
metadata:
  name: smf
  labels:
{{ tuple "smf" . | include "5g-control-plane.metadata_labels" | indent 4 }}
spec:
  type: {{ .Values.config.smf.serviceType }}
  selector:
{{ tuple "smf" . | include "5g-control-plane.metadata_labels" | indent 4 }}
  ports:
{{- if eq .Values.config.upfadapter.deploy false }}
{{- tuple "pfcp" .Values.config.smf.n4 "UDP" .Values.config.smf.serviceType | include "5g-control-plane.service_port" | nindent 2 }}
{{- end }}
{{- tuple "prometheus-exporter" .Values.config.smf.prometheus "TCP" .Values.config.smf.serviceType | include "5g-control-plane.service_port" | nindent 2 }}
{{- tuple "sbi" .Values.config.smf.sbi "TCP" .Values.config.smf.serviceType | include "5g-control-plane.service_port" | nindent 2 }}
{{- end }}
