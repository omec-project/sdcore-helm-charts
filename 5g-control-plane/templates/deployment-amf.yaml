{{- if .Values.config.amf.deploy }}
{{ tuple "amf" . | include "5g-control-plane.service_account" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amf
  labels:
{{ tuple "amf" . | include "5g-control-plane.metadata_labels" | indent 4 }}
spec:
  replicas: 1
  #serviceName: amf-headless
  selector:
    matchLabels:
{{ tuple "amf" . | include "5g-control-plane.metadata_labels" | indent 6 }}
  template:
    metadata:
      labels:
{{ tuple "amf" . | include "5g-control-plane.metadata_labels" | indent 8 }}
      annotations:
    {{- tuple "amf" . | include "5g-control-plane.certs_pod_annotations" | nindent 8 }}
    {{- if .Values.mongodbCommunity.enabled }}
        checksum/mongodb-credentials: {{ include "5g-control-plane.mongodbCredentialsChecksum" . | quote }}
    {{- end }}
    {{- with .Values.config.amf.podAnnotations }}
    {{- toYaml . | nindent 8 }}
    {{- end }}
    spec:
    {{- tuple "amf" . | include "5g-control-plane.pod_common" | trim | nindent 6 }}
      initContainers:
      {{- if .Values.config.webui.deploy }}
      {{- tuple . | include "5g-control-plane.wait_webui" | nindent 6 }}
      {{- end }}
      {{- if .Values.kafka.deploy }}
      - name: wait-kafka-module
        image: {{ .Values.images.repository }}{{ .Values.images.tags.init }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        command: ['sh', '-c', 'until nslookup kafka && nc -z -w 2 kafka 9092; do echo waiting for kafka listener; sleep 4; done;']
      {{- end }}
    {{ tuple "amf" . | include "5g-control-plane.certs_init" | nindent 6 }}
      {{ if .Values.config.coreDump.enabled }}
{{ tuple "amf" . | include "5g-control-plane.coredump_init" | nindent 6 }}
      {{ end }}
      containers:
      - name: amf
        image: {{ .Values.images.repository }}{{ .Values.images.tags.amf }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
      {{ if .Values.config.coreDump.enabled }}
        securityContext:
          runAsUser: 0
      {{ end }}
        stdin: true
        tty: true
        command: [ /opt/amf-run.sh ]
        env:
        - name: GRPC_GO_LOG_VERBOSITY_LEVEL
          value: {{ .Values.config.grpc.golog_verbosity | quote }}
        - name: GRPC_GO_LOG_SEVERITY_LEVEL
          value: {{ .Values.config.grpc.severity | quote }}
        - name: GRPC_TRACE
          value: {{ .Values.config.grpc.trace | quote }}
        - name: GRPC_VERBOSITY
          value: {{ .Values.config.grpc.verbosity | quote }}
        - name: GOGC
          value: {{ .Values.config.gogc | quote }}
      {{- if eq .Values.config.GIN.mode "release" }}
        - name: GIN_MODE
          value: release
      {{- end }}
{{ tuple "amf" . | include "5g-control-plane.certs_env" | indent 8 }}
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      {{- if and .Values.config.amf.healthz .Values.config.amf.healthz.enabled }}
        {{- /* The AMF serves /healthz on :9089 whatever config.amf.prometheus.port says: that value sets only the Service port. */}}
        {{- tuple .Values.config.amf.sbi.port . (dict "httpGet" (dict "path" "/healthz" "port" 9089)) | include "5g-control-plane.probes" | nindent 8 }}
      {{- else }}
        {{- tuple .Values.config.amf.sbi.port . | include "5g-control-plane.probes" | nindent 8 }}
      {{- end }}
      {{- if .Values.resources.enabled }}
        resources:
{{ toYaml .Values.resources.amf | indent 10 }}
      {{- end }}
        volumeMounts:
        - name: nf-config
          mountPath: /opt
{{ tuple "amf" . | include "5g-control-plane.certs_volume_mounts" | indent 8 }}
      {{- if .Values.config.coreDump.enabled }}
        - name: coredump
          mountPath: /tmp/coredump
      {{- end }}
      volumes:
      - name: nf-config
        {{- if .Values.mongodbCommunity.enabled }}
        secret:
          secretName: amf
        {{- else }}
        configMap:
          name: amf
        {{- end }}
          defaultMode: 493
      {{- tuple "amf" . | include "5g-control-plane.certs_volumes" | nindent 6 }}
{{- end }}
