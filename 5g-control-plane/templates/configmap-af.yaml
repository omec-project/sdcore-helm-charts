{{- if .Values.config.af.deploy }}

{{- if not .Values.config.useExistingConfigMap -}}
{{- $afcfg := index .Values.config.af.cfgFiles "afcfg.yaml" }}
{{- $sbi := index $afcfg.configuration "sbi" }}
{{- $northbound := index $afcfg.configuration "northbound" }}

{{- $metrics := index $afcfg.configuration "metrics" }}

{{- if not (hasKey $metrics "port") -}}
{{- $_ := .Values.config.af.prometheus.port | set $metrics "port" -}}
{{- end }}

{{- if not (hasKey $sbi "port") -}}
{{- $_ := .Values.config.af.sbi.port | set $sbi "port" -}}
{{- end }}

{{- if not (hasKey $northbound "port") -}}
{{- $_ := .Values.config.af.northbound.port | set $northbound "port" -}}
{{- end }}
{{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: af
  labels:
{{ tuple "af" . | include "5g-control-plane.metadata_labels" | indent 4 }}
data:
  af-run.sh: |
{{ tuple "bin/_af-run.sh.tpl" . | include "5g-control-plane.template" | indent 4 }}
{{- if not .Values.config.useExistingConfigMap -}}
{{- range $key, $value := .Values.config.af.cfgFiles }}
  {{ $key }}: |-
{{ toYaml $value | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
